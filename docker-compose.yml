version: '3.8'

services:
  phase_35_intel_bot:
    container_name: degen_galactic_oracle_bot
    image: node:20-alpine
    restart: unless-stopped
    environment:
      - ACTIVE_OPERATIONAL_STATE=PHASE_36_TACTICAL_REALIGNMENT
      - VELOCITY_MULTIPLIER_THRESHOLD=1.44
      - BUFFER_PROTECTION_GATE=420
    volumes:
      - .:/usr/src/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  phase_36_open_verification_node:
    container_name: simulation_mirror_engine
    image: python:3.11-slim
    restart: unless-stopped
    environment:
      - VELOCITY_FLOOR=1.44
      - BUFFER_GATE=420
    volumes:
      - .:/app
    working_dir: /app
    command: python3 -m http.server 8080
    healthcheck:
      test: ["CMD", "python3", "test_phase_35_pipeline.py"]
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 5s
